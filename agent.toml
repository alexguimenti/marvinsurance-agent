# Which model the Farting Agent uses, and how it thinks.
# Safe to commit: no secrets here (the API key lives in .env).
# Environment variables win over this file: AGENT_MODEL, AGENT_TEMPERATURE, AGENT_REASONING_EFFORT.

[agent]
# Any model id from https://openrouter.ai/models (ids ending in ":batch" do not work).
model = "deepseek/deepseek-v4.1-flash"

# 0 gives the most consistent decisions.
temperature = 0

# How hard a reasoning model thinks: "low", "medium" or "high".
reasoning_effort = "low"

# Attempts per claim. A claim that fails goes back in the queue; after this many failures
# it is left for a handler.
max_attempts = 2

# Retries of a single model call that times out or meets a provider error.
# step_retries = 2

# Wall-clock limit, in seconds, for one attempt at one claim.
# claim_timeout_s = 300

# Most model calls for one claim, and most steps for a whole run.
# max_model_calls = 30
# run_max_steps = 400
