[project]
name = "marvin-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic-settings",
  "langchain",
  "langchain-openai",
  "langchain-core",
  "langgraph",
  "langgraph-checkpoint-postgres",
  "langgraph-checkpoint-sqlite",
  "langfuse",
  "sqlalchemy",
  "psycopg[binary,pool]",
  "python-dotenv",
  "httpx",
  "pyjwt[crypto]>=2.15.1",
]

[project.optional-dependencies]
dev = ["pytest", "watchfiles"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "agent"]

[tool.setuptools.package-data]
app = ["*.md"]
agent = ["*.md"]
