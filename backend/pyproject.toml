[project]
name = "marvin-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic-settings",
  "langchain",
  "langchain-openai",
  "langchain-core",
  "langgraph",
  "langgraph-checkpoint-postgres",
  "langgraph-checkpoint-sqlite",
  "langfuse",
  "sqlalchemy",
  "psycopg[binary,pool]",
  "python-dotenv",
  "httpx",
  "pyjwt[crypto]>=2.15.1",
  "openrouter>=1.3.142",
  "mangum",
  "mcp<2",
  "boto3>=1.43.127",
  "pyyaml>=6.0.3",
  "langgraph-checkpoint-aws>=1.2.7",
  "bedrock-agentcore>=1.26.0",
  "langchain-mcp-adapters>=0.3.2",
]

[project.optional-dependencies]
dev = ["pytest", "watchfiles"]

# What the backend imports on a server, and nothing of the agent's: the deployment installs exactly this group.
[dependency-groups]
server = [
  "fastapi",
  "uvicorn",
  "mangum",
  "pydantic-settings",
  "sqlalchemy",
  "psycopg[binary]",
  "httpx",
  "pyjwt[crypto]>=2.15.1",
  "openrouter>=1.3.142",
  "pyyaml>=6.0.3",
  "boto3>=1.43.127",
]

# What the context layer imports on Lambda, and nothing else: its package installs exactly this group.
context = [
  "mcp<2",
  "mangum",
  "pyyaml>=6.0.3",
]

# What the agent imports on Runtime, and nothing of the app's: the deployment installs exactly this group, at uv.lock's versions.
runtime = [
  "bedrock-agentcore",
  "langchain",
  "langchain-core",
  "langchain-openai",
  "langgraph",
  "langgraph-checkpoint-postgres",
  "langgraph-checkpoint-sqlite",
  "langgraph-checkpoint-aws",
  "langfuse",
  "psycopg[binary,pool]",
  "httpx",
  "pydantic-settings",
  "python-dotenv",
  "mcp<2",
  "boto3>=1.43.127",
  "openrouter>=1.3.142",
  "pyyaml>=6.0.3",
  "langchain-mcp-adapters>=0.3.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "agent", "context"]

[tool.setuptools.package-data]
app = ["*.md"]
agent = ["*.md"]
context = ["*.md", "*.yaml"]
